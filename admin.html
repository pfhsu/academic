<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>後台管理｜帳號需求調查</title>
<style>
  :root{
    --cream:#FFF0E8; --orange:#FB712D; --orange-bar:#FB7832;
    --green:#1E7700; --green-dark:#155600; --ink:#333; --line:#E7D6CB; --red:#c0392b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);
    font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;line-height:1.6}
  .topbar{height:10px;background:linear-gradient(90deg,var(--orange-bar),var(--orange))}
  .wrap{max-width:1000px;margin:0 auto;padding:18px 16px 60px}
  .head{display:flex;align-items:center;gap:12px;margin:6px 0 18px}
  .head .mark{width:36px;height:36px;border-radius:8px;background:var(--orange);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:19px}
  .head h1{font-size:20px;color:var(--green-dark);margin:0;font-weight:800}
  .head .sub{font-size:13px;color:#a8968b}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}
  /* 登入 */
  #login{max-width:380px;margin:40px auto}
  #login label{display:block;font-weight:700;color:var(--green-dark);margin:14px 0 6px}
  #login input{width:100%;padding:11px 12px;font-size:16px;border:1px solid #d9c8bd;border-radius:8px}
  #login input:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(251,113,45,.15)}
  .btn{padding:10px 16px;font-size:15px;font-weight:800;color:#fff;background:var(--green);
    border:none;border-radius:8px;cursor:pointer}
  .btn:hover{background:var(--green-dark)}
  .btn.ghost{background:#fff;color:var(--green-dark);border:1px solid var(--green)}
  .btn.org{background:var(--orange)} .btn.org:hover{background:#e15f1c}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .err{color:#b8430f;font-weight:700;margin-top:12px;min-height:20px}
  /* 儀表板 */
  #dash{display:none}
  .stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px}
  .stat{flex:1;min-width:150px;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:16px 18px;border-top:5px solid var(--orange)}
  .stat .k{font-size:13px;color:#8a7a70}
  .stat .v{font-size:32px;font-weight:900;color:var(--green-dark);line-height:1.2}
  .stat.remain{border-top-color:var(--green)}
  .stat.remain .v{color:var(--orange)}
  .stat.remain .v.over{color:var(--red)}
  /* 進度條 */
  .progwrap{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:14px 0 22px}
  .progwrap .lab{display:flex;justify-content:space-between;font-size:13px;color:#8a7a70;margin-bottom:6px}
  .prog{height:22px;background:#F1E4DA;border-radius:11px;overflow:hidden}
  .prog .fill{height:100%;width:0;background:linear-gradient(90deg,var(--green),#3a9a15);
    border-radius:11px;transition:width .5s;min-width:2px}
  .prog .fill.over{background:linear-gradient(90deg,#e67e22,var(--red))}
  .warn{color:var(--red);font-weight:800;margin-top:8px;display:none}
  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0 10px}
  .bar h2{font-size:16px;color:var(--green-dark);margin:0;border-left:5px solid var(--orange);padding-left:10px}
  .bar .spacer{flex:1}
  table{width:100%;border-collapse:collapse;background:#fff;font-size:14px}
  th,td{border:1px solid var(--line);padding:8px 10px;text-align:left}
  th{background:#FFF0E8;color:var(--green-dark);font-weight:800;white-space:nowrap}
  td.num,th.num{text-align:right} td.rank{text-align:center;color:#a8968b;width:40px}
  tr:nth-child(even) td{background:#FCF7F3}
  .grp{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;
    background:#EAF6E7;border:1px solid var(--green);color:var(--green-dark)}
  .muted{color:#a8968b;font-size:13px}
  .tblwrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}
  /* 尚未回報 */
  .todo{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .todo .g{margin:8px 0}
  .todo .gt{font-weight:800;color:var(--green-dark);margin-bottom:4px}
  .chip{display:inline-block;font-size:13px;padding:4px 12px;border-radius:16px;margin:3px 4px 3px 0;
    background:#FFF7EF;border:1px solid var(--orange);color:#b8430f}
  .alldone{color:var(--green-dark);font-weight:800}
  .foot{text-align:center;color:#a8968b;font-size:13px;margin-top:26px}
</style>
</head>
<body>
<div class="topbar"></div>
<div class="wrap">
  <div class="head">
    <div class="mark">教</div>
    <div>
      <h1>帳號需求調查 · 後台</h1>
      <div class="sub">長庚科技大學教務處課務組</div>
    </div>
  </div>

  <!-- 登入 -->
  <div class="card" id="login">
    <label>帳號</label>
    <input type="text" id="acc" autocomplete="off" placeholder="請輸入帳號">
    <label>密碼</label>
    <input type="password" id="pw" placeholder="請輸入密碼" onkeydown="if(event.key==='Enter')doLogin()">
    <div style="margin-top:18px"><button class="btn" id="loginBtn" onclick="doLogin()">登入</button></div>
    <div class="err" id="loginErr"></div>
  </div>

  <!-- 儀表板 -->
  <div id="dash">
    <div class="stats">
      <div class="stat"><div class="k">全校名額</div><div class="v" id="sQuota">–</div></div>
      <div class="stat"><div class="k">已回報帳號數</div><div class="v" id="sUsed">–</div></div>
      <div class="stat remain"><div class="k">剩餘可分配</div><div class="v" id="sRemain">–</div></div>
      <div class="stat"><div class="k">已回報單位</div><div class="v" id="sUnits">–</div></div>
    </div>

    <div class="progwrap">
      <div class="lab"><span>名額使用進度</span><span id="progPct">0%</span></div>
      <div class="prog"><div class="fill" id="progFill"></div></div>
      <div class="warn" id="overWarn"></div>
    </div>

    <div class="bar">
      <h2>各單位需求彙總</h2>
      <span class="muted">同單位重複填寫以最新一筆為準</span>
      <span class="spacer"></span>
      <button class="btn ghost" onclick="loadData()">🔄 重新整理</button>
      <button class="btn org" onclick="exportSummary()">⬇ 匯出彙總 CSV</button>
      <button class="btn ghost" onclick="exportRaw()">⬇ 匯出全部 CSV</button>
      <button class="btn ghost" id="openSheet">開啟原始試算表</button>
    </div>
    <div class="tblwrap">
      <table id="sumTbl">
        <thead><tr>
          <th class="rank">#</th><th>院／群組</th><th>系所／單位</th><th>職稱</th><th>姓名</th>
          <th>Email</th><th class="num">需求數量</th><th>最後回覆時間</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="bar"><h2>尚未回報單位</h2><span class="muted" id="todoCount"></span></div>
    <div class="todo" id="todoBox"></div>

    <div class="bar" style="margin-top:26px"><h2>全部回覆紀錄</h2><span class="muted" id="rawCount"></span></div>
    <div class="tblwrap">
      <table id="rawTbl">
        <thead><tr><th>時間</th><th>系所／單位</th><th>職稱</th><th>姓名</th><th>Email</th><th class="num">數量</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="foot" id="meta"></div>
  </div>
</div>

<script>
var CRED = { acc:'', pw:'' };
var SHEET_URL = '';
var LAST = { summary:[], rows:[] };   // 供 CSV 匯出

function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
function today(){ var d=new Date(),p=function(n){return(n<10?'0':'')+n;}; return ''+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate()); }

function doLogin(){
  var acc=document.getElementById('acc').value, pw=document.getElementById('pw').value;
  var btn=document.getElementById('loginBtn');
  document.getElementById('loginErr').textContent='';
  btn.disabled=true; btn.textContent='登入中…';
  google.script.run
    .withSuccessHandler(function(res){
      btn.disabled=false; btn.textContent='登入';
      if(res && res.ok){
        CRED.acc=acc; CRED.pw=pw;
        document.getElementById('login').style.display='none';
        document.getElementById('dash').style.display='block';
        render(res);
      } else { document.getElementById('loginErr').textContent=(res&&res.message)||'登入失敗'; }
    })
    .withFailureHandler(function(err){
      btn.disabled=false; btn.textContent='登入';
      document.getElementById('loginErr').textContent='連線失敗：'+err.message;
    })
    .getAdminData(acc, pw);
}

function loadData(){
  google.script.run
    .withSuccessHandler(function(res){ if(res&&res.ok) render(res); else alert((res&&res.message)||'讀取失敗'); })
    .withFailureHandler(function(err){ alert('讀取失敗：'+err.message); })
    .getAdminData(CRED.acc, CRED.pw);
}

function render(res){
  var rows=res.rows||[], quota=res.quota||0, known=res.knownUnits||[];
  SHEET_URL=res.sheetUrl||'';

  // 各單位彙總：後者覆蓋前者 → 取最新
  var latest={}; rows.forEach(function(r){ latest[r.unit]=r; });
  var groupOf={}; known.forEach(function(k){ groupOf[k[1]]=k[0]; });
  var units=Object.keys(latest).map(function(u){ var r=latest[u]; return {
    group: groupOf[u]||'其他', unit:u, title:r.title, name:r.name, email:r.email, qty:r.qty, ts:r.ts }; });
  units.sort(function(a,b){ return b.qty-a.qty; });
  var used=units.reduce(function(a,r){ return a+(Number(r.qty)||0); },0);
  var remain=quota-used;

  document.getElementById('sQuota').textContent=quota;
  document.getElementById('sUsed').textContent=used;
  var rn=document.getElementById('sRemain'); rn.textContent=remain; rn.className='v'+(remain<0?' over':'');
  document.getElementById('sUnits').textContent=units.length;

  // 進度條
  var pct=quota?Math.round(used/quota*100):0;
  var fill=document.getElementById('progFill');
  fill.style.width=Math.min(100,pct)+'%';
  fill.className='fill'+(used>quota?' over':'');
  document.getElementById('progPct').textContent=pct+'%（'+used+' / '+quota+'）';
  var warn=document.getElementById('overWarn');
  if(used>quota){ warn.style.display='block'; warn.textContent='⚠ 需求已超出名額 '+(used-quota)+' 個，需再協調分配。'; }
  else warn.style.display='none';

  // 彙總表
  var sb=units.map(function(r,i){
    return '<tr><td class="rank">'+(i+1)+'</td><td><span class="grp">'+esc(r.group)+'</span></td>'+
      '<td>'+esc(r.unit)+'</td><td>'+esc(r.title)+'</td><td>'+esc(r.name)+'</td>'+
      '<td>'+esc(r.email)+'</td><td class="num"><b>'+r.qty+'</b></td><td>'+esc(r.ts)+'</td></tr>';
  }).join('')||'<tr><td colspan="8" class="muted">目前尚無回覆</td></tr>';
  document.querySelector('#sumTbl tbody').innerHTML=sb;

  // 尚未回報單位（依已知清單）
  var respondedSet={}; units.forEach(function(u){ respondedSet[u.unit]=true; });
  var byGroup={};
  known.forEach(function(k){ if(!respondedSet[k[1]]){ (byGroup[k[0]]=byGroup[k[0]]||[]).push(k[1]); } });
  var groups=Object.keys(byGroup), todoN=0;
  groups.forEach(function(g){ todoN+=byGroup[g].length; });
  var box=document.getElementById('todoBox');
  if(todoN===0){ box.innerHTML='<span class="alldone">✓ 已知單位皆已回報</span>'; }
  else{
    box.innerHTML=groups.map(function(g){
      return '<div class="g"><div class="gt">'+esc(g)+'</div>'+
        byGroup[g].map(function(u){ return '<span class="chip">'+esc(u)+'</span>'; }).join('')+'</div>';
    }).join('');
  }
  document.getElementById('todoCount').textContent='尚有 '+todoN+' 個已知單位未回報';

  // 全部紀錄（最新在上）
  var raw=rows.slice().reverse();
  document.querySelector('#rawTbl tbody').innerHTML=raw.map(function(r){
    return '<tr><td>'+esc(r.ts)+'</td><td>'+esc(r.unit)+'</td><td>'+esc(r.title)+'</td>'+
      '<td>'+esc(r.name)+'</td><td>'+esc(r.email)+'</td><td class="num">'+r.qty+'</td></tr>';
  }).join('')||'<tr><td colspan="6" class="muted">目前尚無回覆</td></tr>';
  document.getElementById('rawCount').textContent='共 '+rows.length+' 筆';

  document.getElementById('meta').textContent=
    '申請期間 '+(res.period||'')+'　|　回報截止 '+(res.deadline||'')+'　|　資料即時來自 Google 試算表';

  LAST.summary=units; LAST.rows=rows;
}

/* ===== CSV 匯出（含 BOM，Excel 開中文不亂碼）===== */
function toCSV(headers, rows2d){
  var all=[headers].concat(rows2d);
  return '\uFEFF'+all.map(function(row){
    return row.map(function(c){
      var s=String(c==null?'':c);
      return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
    }).join(',');
  }).join('\r\n');
}
function download(name, csv){
  try{
    var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a'); a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); },1500);
  }catch(e){ alert('若瀏覽器擋下下載，可改按「開啟原始試算表」→ 檔案 → 下載 → CSV。'); }
}
function exportSummary(){
  if(!LAST.summary.length){ alert('目前尚無資料'); return; }
  var rows=LAST.summary.map(function(r){ return [r.group,r.unit,r.title,r.name,r.email,r.qty,r.ts]; });
  download('帳號需求_各單位彙總_'+today()+'.csv',
    toCSV(['院／群組','系所／單位','職稱','姓名','Email','需求數量','最後回覆時間'], rows));
}
function exportRaw(){
  if(!LAST.rows.length){ alert('目前尚無資料'); return; }
  var rows=LAST.rows.map(function(r){ return [r.ts,r.unit,r.title,r.name,r.email,r.qty]; });
  download('帳號需求_全部紀錄_'+today()+'.csv',
    toCSV(['時間','系所／單位','職稱','姓名','Email','需求數量'], rows));
}

document.getElementById('openSheet').addEventListener('click', function(){
  if(SHEET_URL) window.open(SHEET_URL,'_blank'); else alert('尚未取得試算表網址，請先重新整理。');
});
</script>
</body>
</html>
